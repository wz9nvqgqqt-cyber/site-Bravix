name: Publicar apresentação BRAVIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar apresentação completa
        uses: actions/checkout@v4
      - name: Conferir integridade de todos os arquivos
        run: node scripts/site-integrity.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar todos os arquivos, imagens e vídeos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar apresentação
        id: deployment
        uses: actions/deploy-pages@v4
